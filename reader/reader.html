<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Lucid Reader</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="lib/rsvp.css">
</head>
<body>
<div id="app" data-mode="normal">

  <header id="topbar">
    <div class="tb-group tb-left">
      <button id="btn-back" class="iconbtn" title="Back to Chrome's PDF viewer" aria-label="Back to Chrome's PDF viewer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="btn-outline" class="iconbtn" title="Contents (O)" aria-label="Contents">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h11"/></svg>
      </button>
      <div class="doctitle">
        <span id="doc-title">Lucid Reader</span>
        <span id="doc-sub" class="sub"></span>
      </div>
    </div>

    <nav id="modes" role="tablist" aria-label="Reading mode">
      <button role="tab" data-mode="normal"     aria-selected="true">Normal</button>
      <button role="tab" data-mode="readalong"  aria-selected="false">Read&#8209;along</button>
      <button role="tab" data-mode="autoscroll" aria-selected="false">Auto&#8209;scroll</button>
      <button role="tab" data-mode="flow"       aria-selected="false" title="Read-along + auto-scroll: the line stays put, the text glides (F)">Flow</button>
      <button role="tab" data-mode="rsvp"       aria-selected="false">RSVP</button>
      <button role="tab" data-mode="pdf"        aria-selected="false">Original PDF</button>
    </nav>

    <div class="tb-group tb-right">
      <div id="playgroup">
        <button id="btn-prev" class="iconbtn" title="Back (←)" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6l-6 6 6 6M18 6v12"/></svg>
        </button>
        <button id="btn-play" class="iconbtn primary" title="Play / pause (Space)" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        </button>
        <button id="btn-next" class="iconbtn" title="Forward (→)" aria-label="Forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6l6 6-6 6M6 6v12"/></svg>
        </button>
        <label id="wpmbox" title="Words per minute (J / K)">
          <input id="wpm" type="number" min="60" max="1200" step="10" aria-label="Words per minute">
          <span>wpm</span>
        </label>
      </div>
      <button id="btn-search" class="iconbtn" title="Search (⌘F or /)" aria-label="Search the document">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      </button>
      <button id="btn-settings" class="iconbtn" title="Reading settings (S)" aria-label="Reading settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M8 14v6"/></svg>
      </button>
    </div>
  </header>

  <div id="progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100"><i></i></div>

  <div id="stage">
    <!-- reflowed text view -->
    <div id="scroller" tabindex="0">
      <div id="measure">
        <div id="overlay" aria-hidden="true"></div>
        <article id="doc" aria-live="off"></article>
        <div id="rail-l" class="rail" aria-hidden="true"><i class="grip" data-edge="l"></i></div>
        <div id="rail-r" class="rail" aria-hidden="true"><i class="grip" data-edge="r"></i></div>
      </div>
    </div>

    <!-- original PDF pages -->
    <div id="pdfview" hidden></div>

    <!-- RSVP -->
    <div id="rsvp" hidden></div>
  </div>

  <footer id="statusbar">
    <span id="status-left"></span>
    <span id="status-right"></span>
  </footer>

  <!-- settings panel (built by panel.js) -->
  <aside id="panel" hidden aria-label="Reading settings"></aside>
  <div id="panel-scrim" hidden></div>

  <!-- first run / no file -->
  <div id="welcome" hidden>
    <div class="w-card">
      <h1>Lucid Reader</h1>
      <p>Drop a PDF here, or pick one from your computer.</p>
      <div class="w-actions">
        <button id="btn-open" class="btn primary">Choose a PDF…</button>
        <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
      </div>
      <p class="w-note">Any PDF you open in Chrome will land here automatically. Use the
        toolbar button or <kbd>Alt</kbd>+<kbd>R</kbd> to switch back and forth.</p>
    </div>
  </div>

  <div id="loading" hidden>
    <div class="l-card">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loading-text">Opening…</div>
      <div id="loading-bar"><i></i></div>
    </div>
  </div>

  <div id="error" hidden>
    <div class="e-card">
      <h2 id="error-title">Could not open this PDF</h2>
      <p id="error-msg"></p>
      <div class="w-actions">
        <button id="error-original" class="btn">Open in Chrome's viewer</button>
        <button id="error-retry" class="btn primary">Try again</button>
      </div>
    </div>
  </div>

  <div id="dropzone" hidden><div>Drop to open</div></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="shortcuts" hidden></div>
</div>

<script type="module" src="reader.js"></script>
</body>
</html>
